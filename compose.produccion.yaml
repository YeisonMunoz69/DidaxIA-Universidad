name: agente-calculo-produccion

services:
  base:
    image: pgvector/pgvector:pg17
    container_name: agente-calculo-base-prod
    environment:
      POSTGRES_USER: agente
      POSTGRES_DB: agente
      POSTGRES_PASSWORD: ${PGPASSWORD_AGENTE:?falta definir PGPASSWORD_AGENTE en el entorno}
    volumes:
      - datos-base-prod:/var/lib/postgresql/data
      - ./infraestructura/inicio-base:/docker-entrypoint-initdb.d:ro
      - ./infraestructura/esquema:/esquema:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agente -d agente"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  migraciones:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: migraciones
    container_name: agente-calculo-migraciones-prod
    environment:
      AGENTE_ENTORNO: produccion
      AGENTE_MIGRACION_AUTORIZADA: "1"
      AGENTE_BD: ${AGENTE_BD:?falta definir AGENTE_BD en el entorno (postgresql://agente:contraseña@base:5432/agente)}
    depends_on:
      base:
        condition: service_healthy
    restart: "no"

  ingesta:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: runtime
    container_name: agente-calculo-ingesta-prod
    command: ["python", "ingesta.py"]
    environment:
      AGENTE_ENTORNO: produccion
      AGENTE_BD: ${AGENTE_BD:?falta definir AGENTE_BD en el entorno (postgresql://agente:contraseña@base:5432/agente)}
    volumes:
      - ./contenido:/app/contenido:ro
      - cache-modelos:/cache-modelos
    depends_on:
      migraciones:
        condition: service_completed_successfully
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: runtime
    container_name: agente-calculo-backend-prod
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      AGENTE_ENTORNO: produccion
      AGENTE_BD: ${AGENTE_BD:?falta definir AGENTE_BD en el entorno (postgresql://agente:contraseña@base:5432/agente)}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?falta definir DEEPSEEK_API_KEY en el entorno}
      AGENTE_LLM: ${AGENTE_LLM:?falta definir AGENTE_LLM en el entorno (ollama | deepseek)}
      AGENTE_LLM_MODELO: ${AGENTE_LLM_MODELO:-}
      AGENTE_LLM_TIEMPO_MAXIMO_S: ${AGENTE_LLM_TIEMPO_MAXIMO_S:-60}
      AGENTE_INTERPRETACION: ${AGENTE_INTERPRETACION:-corroboracion}
      AGENTE_CONTINUIDAD_TUTOR: ${AGENTE_CONTINUIDAD_TUTOR:-1}
      AGENTE_FACTORES_CONDUCTUALES: ${AGENTE_FACTORES_CONDUCTUALES:-1}
      AGENTE_RETROALIMENTACION_DIRECTA: ${AGENTE_RETROALIMENTACION_DIRECTA:-1}
      AGENTE_CONTEXTO_CONVERSACIONAL: ${AGENTE_CONTEXTO_CONVERSACIONAL:-reforzado}
      AGENTE_LIMITE_SESION: ${AGENTE_LIMITE_SESION:-20}
      AGENTE_LIMITE_IP: ${AGENTE_LIMITE_IP:-60}
      AGENTE_LIMITE_IP_AUTENTICADA: ${AGENTE_LIMITE_IP_AUTENTICADA:-300}
      AGENTE_LIMITE_VENTANA_S: ${AGENTE_LIMITE_VENTANA_S:-60}
      AGENTE_CAS_AISLAR: ${AGENTE_CAS_AISLAR:-1}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      DOMINIO_INSTITUCIONAL: ${DOMINIO_INSTITUCIONAL:-unimayor.edu.co}
      DOCENTES_AUTORIZADOS: ${DOCENTES_AUTORIZADOS:-}
      INVESTIGADORES_PROPIETARIOS: yjmunoz@unimayor.edu.co,fahoyos@unimayor.edu.co,jjcaiza@unimayor.edu.co
      INVESTIGADORES_AUTORIZADOS: ${INVESTIGADORES_AUTORIZADOS:-}
      AGENTE_PILOTO_TESIS: ${AGENTE_PILOTO_TESIS:-1}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_REMITENTE: ${RESEND_REMITENTE:-}
      CORREO_PRIVACIDAD: ${CORREO_PRIVACIDAD:-}
      CORREO_INVESTIGACION: ${CORREO_INVESTIGACION:-yjmunoz@unimayor.edu.co,fahoyos@unimayor.edu.co,privacidad.didaxia.pro@gmail.com}
      ALMACENAMIENTO_PRIVADO_RUTA: /custodia/autorizaciones
      FOTOS_PERFIL_RUTA: /custodia/fotos-perfil
    volumes:
      - ./contenido:/app/contenido:ro
      - cache-modelos:/cache-modelos
      - registro-turnos:/app/infraestructura/registro_turnos
      - autorizaciones:/custodia/autorizaciones
      - fotos-perfil:/custodia/fotos-perfil
    depends_on:
      ingesta:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/salud', timeout=5)"
      interval: 10s
      timeout: 7s
      retries: 12
      start_period: 30m
    restart: unless-stopped

  frontend-build:
    build:
      context: frontend
      dockerfile: ../Dockerfile.frontend
      args:
        GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        ORIGEN_PUBLICO: ${ORIGEN_PUBLICO:-https://didaxia.pro}
        ORIGEN_APLICACION: ${ORIGEN_APLICACION:-https://app.didaxia.pro}
        CORREO_PRIVACIDAD: ${CORREO_PRIVACIDAD:-}
    container_name: agente-calculo-frontend-build
    volumes:
      - frontend-estatico:/salida
    restart: "no"

  caddy:
    image: caddy:2-alpine
    container_name: agente-calculo-caddy-prod
    environment:
      DOMINIO: ${DOMINIO:-:80}
      DOMINIO_PUBLICO: ${DOMINIO_PUBLICO:-:8081}
      DIDAXIA_ALIAS_CADDY: ${DIDAXIA_DOMINIO_ALIAS:-www.didaxia.pro}
      ORIGEN_PUBLICO: ${ORIGEN_PUBLICO:-https://didaxia.pro}
    ports:
      - "${DIDAXIA_IP_PUBLICACION:-0.0.0.0}:${DIDAXIA_PUERTO_HTTP:-80}:80"
      - "${DIDAXIA_IP_PUBLICACION:-0.0.0.0}:${DIDAXIA_PUERTO_HTTPS:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - frontend-estatico:/srv/frontend:ro
      - caddy-datos:/data
      - caddy-configuracion:/config
    depends_on:
      frontend-build:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  datos-base-prod:
    name: agente-calculo-datos-prod
  cache-modelos:
    name: agente-calculo-cache-modelos
  registro-turnos:
    name: agente-calculo-registro-turnos
  autorizaciones:
    name: agente-calculo-autorizaciones
  fotos-perfil:
    name: agente-calculo-fotos-perfil
  frontend-estatico:
    name: agente-calculo-frontend-estatico
  caddy-datos:
    name: agente-calculo-caddy-datos
  caddy-configuracion:
    name: agente-calculo-caddy-config
